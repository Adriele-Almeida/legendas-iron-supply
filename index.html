<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0f10">
<title>Legendas Iron Supply</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <h1>Legendas Iron Supply</h1>
  <p>Toque em <strong>Copiar legenda</strong> e cole no Instagram. A imagem abre no Google Drive.</p>
  <input id="busca" type="search" placeholder="Buscar produto…" aria-label="Buscar produto" autocomplete="off">
  <div class="barra">
    <div class="filtros" role="group" aria-label="Filtrar por tipo">
      <button type="button" class="chip" data-filtro="Post" aria-pressed="false">Só post</button>
      <button type="button" class="chip" data-filtro="Story" aria-pressed="false">Só story</button>
    </div>
    <div class="controles">
      <div class="seg" role="group" aria-label="Modo de exibição">
        <button type="button" class="ico" data-modo="lista" aria-pressed="false" aria-label="Lista" title="Lista">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></svg>
        </button>
        <button type="button" class="ico" data-modo="grade" aria-pressed="true" aria-label="Grade" title="Grade">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        </button>
      </div>
      <div class="seg" role="group" aria-label="Zoom">
        <button type="button" class="ico" id="zoomMenos" aria-label="Diminuir" title="Diminuir">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" class="ico" id="zoomMais" aria-label="Aumentar" title="Aumentar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </div>
  </div>
  <p id="contagem" class="contagem" aria-live="polite"></p>
</header>
<main id="lista" class="lista modo-grade"></main>
<p id="vazio" class="vazio" hidden>Nenhum produto encontrado.</p>
<div id="aviso" class="aviso" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
